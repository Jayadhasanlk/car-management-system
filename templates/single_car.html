<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ car.brand }} {{ car.model }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .car-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);

            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .image-section {
            background: #eee;
            min-height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        .no-image {
            color: #888;
            font-size: 18px;
        }

        .details {
            padding: 40px;
        }

        .brand {
            color: #777;
            font-size: 18px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 20px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f5f5f5;
            padding: 18px;
            border-radius: 8px;
        }

        .info-box span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 17px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .update {
            background: #222;
        }

        .delete {
            background: #d32f2f;
        }

        .update:hover {
            background: #444;
        }

        .delete:hover {
            background: #b71c1c;
        }

        @media (max-width: 750px) {

            .car-card {
                grid-template-columns: 1fr;
            }

            .image-section,
            .image-section img {
                height: 300px;
                min-height: 300px;
            }

            .details {
                padding: 25px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <a href="{% url 'home' %}" class="back">
        ← Back to Cars
    </a>

    <div class="car-card">

        <div class="image-section">

            {% if car.image %}

                <img src="{{ car.image.url }}" alt="{{ car.brand }} {{ car.model }}">

            {% else %}

                <span class="no-image">
                    No Image Available
                </span>

            {% endif %}

        </div>


        <div class="details">

            <div class="brand">
                {{ car.brand }}
            </div>

            <h1>
                {{ car.model }}
            </h1>

            <div class="price">
                ₹{{ car.price }}
            </div>


            <div class="info">

                <div class="info-box">

                    <span>Brand</span>

                    <strong>
                        {{ car.brand }}
                    </strong>

                </div>


                <div class="info-box">

                    <span>Model</span>

                    <strong>
                        {{ car.model }}
                    </strong>

                </div>


                <div class="info-box">

                    <span>Year</span>

                    <strong>
                        {{ car.year }}
                    </strong>

                </div>


                <div class="info-box">

                    <span>Fuel Type</span>

                    <strong>
                        {{ car.fuel_type }}
                    </strong>

                </div>

            </div>


            <div class="buttons">

                <a
                    href="{% url 'update' car.pk %}"
                    class="btn update">
                    Update
                </a>

                <a
                    href="{% url 'delete' car.pk %}"
                    class="btn delete">
                    Delete
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
