<!DOCTYPE html>
<html>

<head>

    <title>Car Inventory</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th {
            background: #222;
            color: white;
            padding: 14px;
            font-size: 16px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            color: #444;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .show-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 15px;
        }

        .show-btn:hover {
            background: #444;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Car Inventory Management</h1>

        <table>

            {% for i in keys %}

            <tr>
                <td>{{ i }}</td>
            </tr>

            {% endfor %}

        </table>

        <a href="{% url 'show' %}" class="show-btn">
            View Cars
        </a>

    </div>

</body>

</html>
