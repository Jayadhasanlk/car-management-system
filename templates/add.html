<!DOCTYPE html>
<html>
<head>
    <title>Add Car</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add New Car</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Brand</label>
        <input type="text" name="brand" placeholder="Enter car brand" required>

        <label>Model</label>
        <input type="text" name="model" placeholder="Enter car model" required>

        <label>Price</label>
        <input type="number" name="price" placeholder="Enter price" required>

        <label>Year</label>
        <input type="number" name="year" placeholder="Enter manufacturing year" required>

        <label>Fuel Type</label>
        <select name="fuel_type" required>
            <option value="">Select fuel type</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select>

        <label>Car Image</label>
        <input type="file" name="image">

        <button type="submit">Add Car</button>

    </form>

    <a href="{% url 'show' %}" class="back">
        ← Back to Car Inventory
    </a>

</div>

</body>
</html>
