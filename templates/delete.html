<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Car</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .delete-box {
            width: 420px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #d32f2f;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .car-details {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }

        .car-details p {
            margin: 8px 0;
            color: #333;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .delete-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #d32f2f;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .cancel-btn {
            flex: 1;
            padding: 12px;
            border-radius: 7px;
            background: #555;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="delete-box">

        <h1>Delete Car</h1>

        <p>Are you sure you want to delete this car?</p>

        <div class="car-details">

            <p>
                <strong>Brand:</strong> {{ key.brand }}
            </p>

            <p>
                <strong>Model:</strong> {{ key.model }}
            </p>

            <p>
                <strong>Price:</strong> ₹{{ key.price }}
            </p>

            <p>
                <strong>Year:</strong> {{ key.year }}
            </p>

            <p>
                <strong>Fuel Type:</strong> {{ key.fuel_type }}
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>

                <a href="{% url 'show' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>
